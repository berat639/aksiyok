# Isolated Axamaz panel. Only the web and WebSocket endpoints join Dokploy's proxy network.
# Configure secrets in Dokploy Environment; do not commit their values.
services:
  axamaz-db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: axamaz
      POSTGRES_USER: axamaz
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U axamaz -d axamaz"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [panel]

  axamaz-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [panel]

  axamaz-api:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgresql://axamaz:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in Dokploy}@axamaz-db:5432/axamaz
      REDIS_URL: redis://axamaz-redis:6379
      POSTGRES_HOST_OVERRIDE: axamaz-db
      REDIS_HOST_OVERRIDE: axamaz-redis
      APP_URL: https://app.axamaz.com
      CLIENT_APP_URL: https://app.axamaz.com
      CORS_ORIGIN: https://app.axamaz.com,https://axamaz.com,https://www.axamaz.com
      SHARED_APP_HOSTS: app.axamaz.com
      DEFAULT_CLINIC_HOSTS: app.axamaz.com
      DEFAULT_CLINIC_NAME: Axamaz
      PLATFORM_ADMIN_HOSTS: app.axamaz.com
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in Dokploy}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?Set INTERNAL_PROXY_SECRET in Dokploy}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:?Set INTEGRATION_ENCRYPTION_KEY in Dokploy}
      ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in Dokploy}
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@axamaz.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in Dokploy}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_AUTH_REDIRECT_URI: https://app.axamaz.com/api/auth/google/callback
      OAUTH_REDIRECT_URI: https://app.axamaz.com/api/admin/settings/calendar/callback
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      TELEPHONY_ENABLED: "0"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      axamaz-db: { condition: service_healthy }
      axamaz-redis: { condition: service_healthy }
    volumes:
      - server_data:/app/data
      - server_uploads:/app/server/public/uploads
      - server_tenant_assets:/app/server/public/tenant-assets
    healthcheck:
      test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:3001/');if(!r.ok)process.exit(1)"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks: [panel, dokploy-network]

  axamaz-panel:
    build:
      context: ../..
      dockerfile: client/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
        NEXT_PUBLIC_BACKEND_URL: ""
        NEXT_PUBLIC_WS_URL: wss://app.axamaz.com/ws
        SERVER_URL: http://axamaz-api:3001
        BACKEND_PROXY_URL: http://axamaz-api:3001
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_URL: http://axamaz-api:3001
      BACKEND_PROXY_URL: http://axamaz-api:3001
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET:?Set INTERNAL_PROXY_SECRET in Dokploy}
      ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:?Set INITIAL_ADMIN_PASSWORD in Dokploy}
    depends_on:
      axamaz-api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3002/login >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s
    networks: [panel, dokploy-network]

volumes:
  postgres_data:
  redis_data:
  server_data:
  server_uploads:
  server_tenant_assets:

networks:
  panel:
  dokploy-network:
    external: true
